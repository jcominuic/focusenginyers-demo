<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus – Asset Management & Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#004692; --navy:#0b2559; --navy2:#123a86; --yellow:#f2a900; --ink:#1d2433; --muted:#5b6475;
  --line:#dfe3ea; --bg:#f4f6f9; --card:#fff; --red:#c62828; --redbg:#fdecec; --green:#2e7d32; --greenbg:#e8f4ea;
  --amber:#a86400; --amberbg:#fff4de;
}
*{box-sizing:border-box}
body{margin:0;font-family:Lato,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 22px;position:sticky;top:0;z-index:20}
.top img{height:30px}
.top .brand{display:flex;flex-direction:column;line-height:1.15}
.top .brand b{color:var(--navy);font-size:16px}
.top .brand span{color:var(--muted);font-size:12px;font-style:italic}
.top nav{margin-left:auto;display:flex;gap:6px}
.top nav button{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:700}
.top nav button.on{background:#e8eef8;color:var(--blue)}
main{max-width:1280px;margin:0 auto;padding:22px}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--amberbg);color:var(--amber)}
.banner.err{background:var(--redbg);color:var(--red)}
.banner.info{background:#e8eef8;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:700;color:var(--navy)}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
h1,h2,h3{color:var(--navy);margin:0}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.st-verificat{background:var(--greenbg);color:var(--green)}
.st-pendent{background:var(--redbg);color:var(--red)}
.st-manual{background:#e8eef8;color:var(--navy)}
.st-descartat{background:#eceff3;color:var(--muted)}
.rs-esborrany{background:#eceff3;color:var(--muted)}
.rs-revisio{background:var(--amberbg);color:var(--amber)}
.rs-llest{background:var(--greenbg);color:var(--green)}
.rs-publicat{background:var(--blue);color:#fff}
.pend{color:var(--red);font-weight:900}
/* Portada */
.hero{background:linear-gradient(115deg,var(--navy),var(--blue));color:#fff;border-radius:14px;padding:26px 28px;margin-bottom:18px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:26px}
.hero p{margin:6px 0 0;opacity:.9;font-style:italic}
.hero svg{position:absolute;right:-40px;top:-30px;opacity:.18}
.cats{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--muted)}
.cats button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.cats button .soon{font-size:10px;margin-left:6px;background:var(--yellow);color:var(--navy);padding:1px 6px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fitxa{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:118px;background:linear-gradient(120deg,#0a2a6e,#1b4fb0 65%,#0d3b8f);color:#fff;padding:14px 16px;position:relative;overflow:hidden}
.thumb.ww{background:#fff;color:var(--navy);border-bottom:3px solid var(--blue)}
.thumb b{display:block;font-size:15px;line-height:1.2;max-width:78%}
.thumb small{display:block;margin-top:6px;font-size:11px;opacity:.85}
.thumb .lg{position:absolute;right:10px;bottom:10px;background:#fff;border-radius:6px;padding:3px 5px}
.thumb .lg img{height:16px;display:block}
.fitxa .body{padding:12px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.fitxa .date{font-size:12px;color:var(--muted);font-weight:700}
.fitxa .t{font-weight:900;color:var(--navy);font-size:14px}
.fitxa .s{font-size:13px;color:var(--ink)}
.fitxa .acts{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* Editor */
.sel{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:10px;align-items:end}
.sel label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);font-weight:700;gap:4px}
.sel input,.sel select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.title-out{font-weight:900;color:var(--navy);font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .cnt{display:inline-block;margin-left:6px;background:var(--redbg);color:var(--red);border-radius:999px;font-size:11px;padding:0 6px}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.dt th{background:#f0f3f8;text-align:left;padding:7px 8px;color:var(--navy);font-size:11.5px;}
table.dt td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
table.dt tr.grp td{background:#f8f9fb;font-weight:900;color:var(--navy)}
table.dt tr.isp td.val{background:var(--redbg)}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.src a{word-break:break-all}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{margin-bottom:14px}
.sec textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;line-height:1.5;resize:vertical}
.rendered{background:#fafbfd;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;line-height:1.55}
.rendered sup,.page sup{color:var(--blue);font-weight:700;font-size:.7em;margin-left:1px}
.rendered .bad,.page .bad{background:var(--redbg);color:var(--red);font-weight:900;padding:0 3px;border-radius:3px}
.qc li{margin:6px 0;line-height:1.4}
.qc .e{color:var(--red)} .qc .w{color:var(--amber)} .qc .ok{color:var(--green)}
.hl label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.hl label.on{border-color:var(--blue);background:#f2f6fd}
.hl input[type=text]{width:100%;border:0;font-weight:900;color:var(--navy);font-size:15px;background:transparent}
.modal-bg{position:fixed;inset:0;background:rgba(11,37,89,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal .f{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center;margin:12px 0}
.modal .f label{font-size:12px;font-weight:700;color:var(--muted)}
.modal .f input,.modal .f select,.modal .f textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.modal pre{white-space:pre-wrap;background:#f4f6f9;border-radius:8px;padding:10px;font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:13px;max-width:90vw}
.statusbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.log{font-size:12px;color:var(--muted);max-height:120px;overflow:auto}
/* ===== Pages (A4 at 96dpi) ===== */
.pages{display:flex;flex-direction:column;gap:18px;align-items:center;overflow:auto;padding:6px 0 20px}
.page{width:794px;min-height:1123px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);position:relative;font-family:Lato,sans-serif;color:#1d2433;overflow:hidden}
.page .pbody{padding:26px 56px 90px 110px;font-size:12.6px;line-height:1.5}
.page .pfoot{position:absolute;left:0;right:0;bottom:28px;padding-left:110px;font-size:11px;font-weight:700}
.page .pfoot .b{color:#1b4fb0} .page .pfoot .y{color:var(--yellow)}
.page .pnum{position:absolute;left:46px;bottom:26px;color:#1b4fb0;font-size:13px}
.page .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:110px;font-weight:900;color:rgba(198,40,40,.08);transform:rotate(-30deg)}
.phead{height:200px;background:linear-gradient(120deg,#0a2a6e 0%,#1747a6 55%,#0b3489 100%);position:relative;overflow:hidden;color:#fff;padding:52px 56px 0 110px}
.phead h1{color:#fff;font-size:29px;line-height:1.18;font-weight:900;max-width:470px}
.phead .sub{font-weight:700;font-size:16px;margin-top:4px}
.phead .logo{position:absolute;right:34px;top:62px;background:#fff;border-radius:8px;padding:6px 8px}
.phead .logo img{height:30px;display:block}
.phead .tag{position:absolute;right:36px;top:112px;font-style:italic;font-size:13px}
.phead svg{position:absolute;left:0;top:0}
.page ul.bul{margin:0;padding-left:16px}
.page ul.bul li{margin-bottom:9px;text-align:justify}
.page h2.ps{color:#1b4fb0;font-size:21px;font-weight:900;margin:0 0 8px}
.page h3.ps{color:#1b4fb0;font-size:17px;font-weight:900;margin:14px 0 8px}
.page .chartT{color:var(--yellow);font-weight:900;font-size:13px}
.page .chartS{color:var(--yellow);font-size:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.page table.mt{width:100%;border-collapse:collapse;font-size:9.4px;line-height:1.25}
.page table.mt th{font-weight:700;text-align:center;padding:1px 3px;border-bottom:1px solid #333}
.page table.mt th.l{text-align:left}
.page table.mt td{padding:1px 3px;text-align:right;font-variant-numeric:tabular-nums}
.page table.mt td.l{text-align:left;white-space:nowrap}
.page table.mt tr.sep td{border-top:1px solid #333}
.page table.mt td.c{border-left:1px solid #999}
.page table.mt .bad{font-size:7.4px;padding:0 1px}
.page .pos{color:#1e9e4a} .page .neg{color:#d32f2f}
.page .fonts li{margin-bottom:5px;font-size:10.5px;line-height:1.4;word-break:break-word}
.page .legal p{font-size:10.2px;margin:0 0 9px;text-align:justify}
.page .legal h4{font-size:11px;margin:12px 0 6px}
/* WW page */
.wwhead{display:flex;align-items:center;padding:26px 40px 8px;gap:20px}
.wwhead img{height:34px}
.wwhead .ttl{flex:1;text-align:center;color:var(--blue);font-weight:900;font-size:24px}
.wwhead .urls{font-size:10px;color:var(--blue);text-align:right}
.wwdate{text-align:right;font-weight:900;font-size:11px;color:var(--blue);padding:0 40px;border-bottom:1px solid var(--blue)}
.wwsec{color:var(--blue);font-size:11px;font-weight:700;border-bottom:1px solid var(--blue);margin:10px 40px 6px;padding-bottom:2px}
.wwtxt{padding:0 40px;font-size:11px;text-align:justify;line-height:1.45}
.wwtab{margin:0 auto;width:600px;border-collapse:collapse;font-size:10px}
.wwtab th{color:var(--blue);font-weight:700;text-align:center;border-bottom:1px solid var(--blue);padding:1px 4px}
.wwtab th.l{text-align:left}
.wwtab td{padding:1px 4px;text-align:center}
.wwtab td.l{text-align:left}
@media (max-width:900px){.sel{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
</style>
</head>

<script>window.__SEED__=[{"op": "set", "path": "reports/macro-2026-11-09", "data": {"id": "macro-2026-11-09", "type": "macro", "weekStart": "2026-11-09", "weekEnd": "2026-11-13", "pubDate": "2026-11-16", "title": "Informe setmanal macro del 9 al 13 de novembre de 2026", "headlineOptions": ["Inflació persistent als EUA i una Fed a punt de pujar tipus", "Sorpresa inflacionista i relleu a NVIDIA sacsegen els mercats", "La Fed escalfa motors davant d'una inflació que no cedeix"], "headline": "Inflació persistent als EUA i una Fed a punt de pujar tipus", "summary": "La inflació d'octubre als Estats Units va superar les previsions i va obrir la porta a augments de tipus més intensos per part de la Fed. Les borses van tancar la setmana amb guanys, mentre la rendibilitat del deute nord-americà repuntava.", "bullets": ["**Setmana de guanys a les borses malgrat la volatilitat del sector tecnològic.** L'S&P 500 va tancar a 7.561,67 punts, amb un avenç setmanal del 2,5 %, el primer des de principis d'octubre{{f:us_week}}, i l'IBEX 35 va recuperar els 20.000 punts (20.020,1; +3,36 % en la setmana i +15,67 % en l'any){{f:ibex_week}}. La dimissió del conseller delegat de NVIDIA, Jensen Huang, va pesar sobre Wall Street dijous{{f:nvidia}}. A la renda fixa, la rendibilitat del bo del Tresor nord-americà a 2 anys va pujar del 4,51 % al 4,88 % i la del 10 anys, del 4,86 % al 5,15 %{{r:us2:w1}}{{r:us2:last}}{{r:us10:w1}}{{r:us10:last}}.", "**Als Estats Units, la inflació d'octubre va sorprendre a l'alça.** L'IPC va augmentar un 0,4 % mensual (set26: 0,6 %) i la subjacent, un 0,3 %{{f:cpi}}, per sobre del que esperava el consens{{f:cpi_cons}}. No hi ha taxa interanual oficial, ja que el tancament del govern federal va impedir recollir les dades d'octubre del 2025{{f:cpi_gap}}. Els preus de producció van pujar un 0,3 % mensual i un 6,5 % interanual{{f:ppi}}, el ritme més alt des del novembre del 2022{{f:ppi_max}}. El governador de la Fed Christopher Waller va defensar que, amb una subjacent al voltant del 0,3 % o superior, caldria considerar un augment de 50 punts bàsics a la reunió del desembre{{f:waller}}. El tipus rector es manté en la banda del 3,75 %-4,00 %{{r:fed_lo:last}}{{r:fed_hi:last}}.", "**Trump es desmarca d'un acord amb l'Iran i el petroli rebota a mitja setmana.** El president nord-americà va afirmar el 12 de novembre que els Estats Units ja no necessiten un acord amb l'Iran{{f:iran}}. El mateix dia, el Brent va pujar un 3,3 %, fins als 95,82 dòlars per barril, després que els hutis reivindiquessin atacs contra instal·lacions energètiques saudites i l'Iran informés d'explosions en quatre petroliers a l'estret d'Ormuz{{f:houthi}}. Tot i això, el cru va tancar la setmana amb una caiguda propera al 2,5 % (Brent: 95,84 dòlars), la segona setmana consecutiva de descensos, davant els senyals d'excés d'oferta{{f:oil_week}}{{r:brent:last}}.", "**Les exportacions de la Xina van mantenir un fort dinamisme a l'octubre.** Les vendes a l'exterior van créixer un 35,2 % interanual, fins als 412.300 milions de dòlars, i les importacions, un 41,6 %{{f:china_trade}}, amb les exportacions de semiconductors avançant un 137,1 % i les d'automòbils, un 37,6 %{{f:china_semis}}. El superàvit comercial es va moderar fins als 105.300 milions (set26: 133.500 milions), però l'acumulat de gener a octubre se situa en 1,04 bilions de dòlars{{f:china_trade}}.", "**La vaga general a Espanya va tenir un seguiment desigual.** La primera vaga general des del 2012, convocada contra la crisi de l'habitatge i la pèrdua de poder adquisitiu a 18 dies de les eleccions legislatives, va registrar un seguiment «molt important» segons els sindicats i «baix» segons la patronal{{f:strike}}. Segons Red Eléctrica, la demanda elèctrica a les 18.00 h era un 2,42 % inferior a la del dia anterior, amb una caiguda màxima del 15,49 % entre les 10.00 i les 11.00 h{{f:strike_elec}}."], "agenda": ["ag_jp_gdp", "ag_cn", "ag_zew", "ag_us_retail", "ag_uk_cpi", "ag_jp_cpi"], "chart": {"title": "E   const clone = d => JSON.parse(JSON.stringify(d));
  function snapDoc(path){ const d=store[path]; return {id:path.split("/").pop(), exists:!!d, data:()=>d?clone(d):undefined, metadata:{fromCache:false,hasPendingWrites:false}}; }
  function children(col){ const n=col.split("/").length+1; return Object.keys(store).filter(p=>p.startsWith(col+"/") && p.split("/").length===n).sort(); }
  function notify(){ persist(); listeners.forEach(l=>{ try{l();}catch(e){console.error(e);} }); }
  function docRef(path){ return {path, id:path.split("/").pop(),
    get:async()=>snapDoc(path),
    set:async(d,o)=>{ store[path] = (o&&o.merge&&store[path]) ? Object.assign(store[path], clone(d)) : clone(d); notify(); },
    update:async d=>{ if(!store[path]) throw {code:"not_found",message:"El document no existeix"}; Object.assign(store[path], clone(d)); notify(); },
    delete:async()=>{ delete store[path]; notify(); },
    collection:id=>colRef(path+"/"+id),
    onSnapshot:(n)=>{ const f=()=>n(snapDoc(path)); listeners.add(f); setTimeout(f,0); return ()=>listeners.delete(f); } }; }
  function colRef(path){ return {path, id:path.split("/").pop(), doc:id=>docRef(path+"/"+(id||Math.random().toString(36).slice(2,12))),
    add:async d=>{ const r=docRef(path+"/"+Math.random().toString(36).slice(2,12)); await r.set(d); return r; },
    onSnapshot:(n)=>{ const f=()=>{ const docs=children(path).map(snapDoc); n({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}}); }; listeners.add(f); setTimeout(f,0); return ()=>listeners.delete(f); },
    get:async()=>{ const docs=children(path).map(snapDoc); return {docs,size:docs.length,empty:!docs.length}; } }; }
  const db = {doc:docRef, collection:colRef};
  const downloads = { save: async ({filename, data, mimeType}) => {
    const blob = data instanceof Blob ? data : new Blob([data], {type: mimeType || "text/plain;charset=utf-8"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename || "fitxer";
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return {status:"saved"}; } };
  window.claude = { use: async n => ({db, user:{can:async()=>true}, downloads, sample:null}[n] ?? null) };
  window.focusDemoReset = () => { if(!confirmReset()) return; try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); };
  function confirmReset(){ const b=document.getElementById("demo-reset"); if(b.dataset.armed){ return true; } b.dataset.armed="1"; b.textContent="Segur? Torna a clicar"; setTimeout(()=>{ delete b.dataset.armed; b.textContent="Restableix les dades"; }, 3000); return false; }
  document.addEventListener("DOMContentLoaded", () => {
    const bar = document.createElement("div");
    bar.id = "demo-bar";
    bar.innerHTML = '<b>Versió de demostració</b> · Les dades es desen només en aquest navegador · La redacció amb Claude no està disponible: els textos s\'editen a mà <button id="demo-reset" onclick="focusDemoReset()">Restableix les dades</button>';
    const st = document.createElement("style");
    st.textContent = '#demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff4d6;border-top:1px solid #e3c66b;color:#5a4300;font:12.5px/1.4 system-ui,sans-serif;padding:7px 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}#demo-bar button{margin-left:auto;font:inherit;border:1px solid #c9a63a;background:#fff;border-radius:5px;padding:3px 10px;cursor:pointer}body{padding-bottom:40px}@media print{#demo-bar{display:none}}';
    document.head.appendChild(st); document.body.appendChild(bar);
  });
})();

/* ======================= Utilitats ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MES = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];
const MES3 = ["gen","febr","març","abr","maig","juny","jul","ag","set","oct","nov","des"];
const deMes = m => (/^[aeiou]/.test(MES[m]) ? "d'" : "de ") + MES[m];
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const iso = d => d.toISOString().slice(0,10);
const addD = (s,n) => { const d = pd(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const fmtD = s => { if(!s) return "—"; const d = pd(s); return `${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}/${d.getUTCFullYear()}`; };
const longD = s => { const d = pd(s); return `${d.getUTCDate()} ${deMes(d.getUTCMonth())} de ${d.getUTCFullYear()}`; };
const today = () => iso(new Date());
function nf(v, dec, thousands=false){
  if(v===null||v===undefined||isNaN(v)) return null;
  let s = Number(v).toFixed(dec);
  let [a,b] = s.split(".");
  if(thousands) a = a.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return b ? `${a},${b}` : a;
}
function mondayOf(s){ const d = pd(s); const wd = (d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-wd); return iso(d); }
function weekTitle(type, mon){
  const fri = addD(mon,4), a = pd(mon), b = pd(fri);
  const base = TYPES[type].name.replace("Informe setmanal macro","Informe setmanal macro");
  let range;
  if(a.getUTCMonth()===b.getUTCMonth()) range = `del ${a.getUTCDate()} al ${b.getUTCDate()} ${deMes(b.getUTCMonth())} de ${b.getUTCFullYear()}`;
  else if(a.getUTCFullYear()===b.getUTCFullYear()) range = `del ${a.getUTCDate()} ${deMes(a.getUTCMonth())} al ${b.getUTCDate()} ${deMes(b.getUTCMonth())} de ${b.getUTCFullYear()}`;
  else range = `del ${a.getUTCDate()} ${deMes(a.getUTCMonth())} de ${a.getUTCFullYear()} al ${b.getUTCDate()} ${deMes(b.getUTCMonth())} de ${b.getUTCFullYear()}`;
  return `${base} ${range}`;
}
function subtitleRange(r){ return weekTitle("macro", r.weekStart).replace("Informe setmanal macro ","Informe setmanal "); }
// Mensual: pubDate = dia 1 del mes de publicació; cobreix el mes anterior
const monthName = s => { const d=pd(s); return `${deMes(d.getUTCMonth())} del ${d.getUTCFullYear()}`; };
const monthTitle = pub => `Informe mensual ${monthName(pub)}`;
const longDdel = s => { const d = pd(s); return `${d.getUTCDate()} ${deMes(d.getUTCMonth())} del ${d.getUTCFullYear()}`; };
const eom = (y,m) => iso(new Date(Date.UTC(y,m+1,0))); // m 0-based
function refTarget(r, ref){
  const e = r.weekEnd, d0 = pd(e);
  if(ref==="last") return e;
  if(ref==="w1") return addD(e,-7);
  if(ref==="fmi") return null;
  if(r.type==="mensual" && (ref==="m1"||ref==="m3")) return eom(d0.getUTCFullYear(), d0.getUTCMonth()-(ref==="m1"?1:3));
  if(ref==="m1"||ref==="m3"){ const d = pd(e); d.setUTCMonth(d.getUTCMonth()-(ref==="m1"?1:3)); return iso(d); }
  if(ref==="ytd") return `${d0.getUTCFullYear()-1}-12-31`;
  if(ref==="y1"){ if(r.type==="mensual") return eom(d0.getUTCFullYear()-1, d0.getUTCMonth()); const d = pd(e); d.setUTCFullYear(d.getUTCFullYear()-1); return iso(d); }
}

const S = { db:null, user:null, sample:null, downloads:null, canWrite:true, dbState:"loading",
  reports:[], cur:null, rows:{}, facts:{}, subs:[], view:"portada", tab:"dades", cat:"actualitat", q:"", onlyPub:false,
  filter:"tots", busy:null, sel:{type:"macro", mon:null} };

function go(v){ S.view=v; try{ history.replaceState(null,"","#"+v); }catch(e){} render(); }
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h==="portada"||h==="editor"){ S.view=h; render(); }});

async function init(){
  const h = location.hash.slice(1); if(h==="editor") S.view="editor";
  render();
  const [db,user,sample,dl] = await Promise.all(["db","user","sample","downloads"].map(n=>claude.use(n).catch(()=>null)));
  S.db=db; S.user=user; S.sample=sample; S.downloads=dl;
  if(user){ try{ const c = await user.can("data.write"); if(c===false) S.canWrite=false; }catch(e){} }
  if(!db){ S.dbState="none"; render(); return; }
  const timer = setTimeout(()=>{ if(S.dbState==="loading"){ S.dbState="slow"; render(); }},10000);
  db.collection("reports").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.dbState="ok"; }
    S.reports = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(S.cur){ const n = S.reports.find(r=>r.id===S.cur.id); if(n) S.cur=n; }
    else if(S.reports.length && S.view==="editor"){ openReport(latestReport().id, false); }
    render();
  }, err=>{ clearTimeout(timer); S.dbState="err"; S.dbErr=err.message; render(); });
}
function latestReport(){ return [...S.reports].sort((a,b)=>(b.weekStart||"").localeCompare(a.weekStart||""))[0]; }

function openReport(id, switchView=true){
  S.subs.forEach(u=>u()); S.subs=[]; S.rows={}; S.facts={};
  S.cur = S.reports.find(r=>r.id===id) || null;
  if(S.cur){ S.sel={type:S.cur.type, mon:S.cur.weekStart}; }
  if(S.db && S.cur){
    S.subs.push(S.db.collection(`reports/${id}/rows`).onSnapshot(s=>{ S.rows={}; s.docs.forEach(d=>S.rows[d.id]=d.data()); render(); }, e=>toast("Error de dades: "+e.message)));
    S.subs.push(S.db.collection(`reports/${id}/facts`).onSnapshot(s=>{ S.facts={}; s.docs.forEach(d=>S.facts[d.id]={id:d.id,...d.data()}); render(); }, e=>toast("Error de dades: "+e.message)));
  }
  if(switchView){ S.view="editor"; try{ history.replaceState(null,"","#editor"); }catch(e){} }
  render();
}
async function saveReport(patch, logText){
  if(!S.cur||!S.db) return;
  const p = {...patch, updatedAt:new Date().toISOString()};
  if(logText){ p.log = [{at:p.updatedAt, text:logText}, ...(S.cur.log||[])].slice(0,60); }
  Object.assign(S.cur, p);
  try{ await S.db.doc(`reports/${S.cur.id}`).update(p); }
  catch(e){ toast(e.code==="invalid_argument" ? "No tens permís per desar canvis." : "No s'ha pogut desar: "+e.message); }
}
async function createReport(type, mon){
  const id = type==="mensual" ? `mensual-${mon.slice(0,7)}` : `${type}-${mon}`;
  if(S.reports.find(r=>r.id===id)){ openReport(id); return; }
  if(!S.db){ toast("La base de dades no està disponible."); return; }
  let ws, we, pub, title;
  if(type==="mensual"){ const p=pd(mon); pub=mon; ws=iso(new Date(Date.UTC(p.getUTCFullYear(),p.getUTCMonth()-1,1))); we=eom(p.getUTCFullYear(),p.getUTCMonth()-1); title=monthTitle(pub); }
  else { ws=mon; we=addD(mon,4); pub=addD(mon,7); title=weekTitle(type,mon); }
  const r = {id, type, weekStart:ws, weekEnd:we, pubDate:pub, title, category:"actualitat",
    sections: type==="mensual" ? MONTH_SECTIONS.map(x=>({id:x.id, text:"", approved:false})) : null, sectors:null,
    headline:"", headlineOptions:[], summary:"", bullets:[], agenda:[], chart:null, comentari:"", destacatsTitol:"", destacats:"", funds:null,
    status:"esborrany", createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
    log:[{at:new Date().toISOString(), text:"Informe creat des de l'editor."}]};
  try{ await S.db.doc(`reports/${id}`).set(r); S.reports.push(r); openReport(id); toast("Informe creat. Ara cal recopilar-ne les dades."); }
  catch(e){ toast("No s'ha pogut crear: "+e.message); }
}

function change(ind, a, b){
  if(!okRow(a)||!okRow(b)) return null;

  const add = (org,url,detail,date,consult)=>{
    const k = (org||"")+"|"+(url||"");
    if(!(k in idx)){ idx[k]=list.length+1; list.push({n:idx[k], org, url, details:[], dates:new Set(), consults:new Set()}); }
    const e = list[idx[k]-1]; if(detail && !e.details.includes(detail)) e.details.push(detail); if(date) e.dates.add(date); if(consult) e.consults.add(consult);
    return idx[k];
  };
  const r = S.cur; if(!r) return {list, num:()=>null, rowNums:()=>[]};
  const texts = reportTexts(r).map(x=>x.t);
  const tokNum = {};
  for(const t of texts){ for(const m of t.matchAll(TOK)){ const x = resolveTok(m[1],m[2],m[3]); if(x.ok){ const s=x.src;
    tokNum[x.key] = add(s.org, s.url, m[1]==="r" ? IND[m[2]]?.l : (s.text||"").slice(0,90), s.dataDate||s.date, s.consultDate); } } }
  if(r.chart && r.chart.org) add(r.chart.org, r.chart.url, "Gràfic de la setmana: "+(r.chart.title||""), r.chart.dataDate, r.chart.consultDate||"");
  for(const id of (r.agenda||[])){ const f=S.facts[id]; if(okFact(f)) tokNum["f:"+id]=add(f.org,f.url,"Agenda: "+f.text,f.date,f.consultDate); }
  const rowN = {};
  for(const {ind,ref} of pairs(r.type)){ const w=S.rows[rowKey(ind,ref)]; if(okRow(w)){ rowN[rowKey(ind,ref)] = add(w.org,w.url,lbl(ind),w.dataDate,w.consultDate); } }
  if(r.type==="mensual" && r.sectors) add(r.sectors.org||"Bloomberg (export)", r.sectors.url||"", "Taula 5. Evolució sectorial", r.sectors.dataDate, r.sectors.consultDate);
  if(r.type==="ww" && r.funds) add(r.funds.org||"CI Gestió (dades internes)", r.funds.url||"", "Rendiment fons propis", r.funds.dataDate, r.funds.consultDate);
  return {list, num:k=>tokNum[k]??null, rowNums:ind=>[...new Set(Object.keys(REFS).map(ref=>rowN[rowKey(ind,ref)]).filter(Boolean))]};
}
function renderText(t, src){
  let h = esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  h = h.replace(/\{\{(r|f):([a-z0-9_]+)(?::([a-z0-9]+))?\}\}/g,(m,k,a,b)=>{
    const x = resolveTok(k,a,b);
    if(!x.ok) return `<span class="bad" title="${esc(x.exists?"Dada pendent":"Referència inexistent")}">[PENDENT]</span>`;
    const n = src ? src.num(x.key) : null; return `<sup title="${esc(x.src.org||"")}">[${n??"?"}]</sup>`;
  });
  return h.replace(/(<sup[^>]*>\[\d+\]<\/sup>)(\s*<sup[^>]*>\[\d+\]<\/sup>)+/g, m=>{
    const ns=[...new Set([...m.matchAll(/\[(\d+)\]/g)].map(x=>x[1]))]; return `<sup>[${ns.join(",")}]</sup>`; });
}

/* ======================= Control de qualitat ======================= */
function runQC(){
  const r=S.cur, E=[], W=[]; if(!r) return {E,W};
  // 1. Dades pendents a les taules
  const pend = allRows().filter(x=>!okRow(x));
  if(pend.length) E.push({t:`${pend.length} dades de les taules estan en estat PENDENT o sense valor.`, list:pend.slice(0,400).map(x=>`${lbl(x.ind)} · ${REFS[x.ref]}${x.note?" — "+x.note:""}`)});
  // 2. Fets pendents no descartats
  const pf = Object.values(S.facts).filter(f=>f.status==="pendent");
  if(pf.length) E.push({t:`${pf.length} fets o cites d'agenda pendents de verificar (verifica'ls o descarta'ls).`, list:pf.map(f=>`${f.text} — ${f.org||"sense font"}${f.note?" ("+f.note+")":""}`)});
  // 3. Xifres sense font i tokens no vàlids
  const texts = reportTexts(r);
  const noSrc=[], badTok=[];
  for(const {t,where} of texts){
    const sentences = t.split(/(?<=[.!?»])\s+(?=[A-ZÀ-ÚÇ«(\*])/);
    for(const s of sentences){
      const toks=[...s.matchAll(TOK)];
      for(const m of toks){ const x=resolveTok(m[1],m[2],m[3]); if(!x.ok) badTok.push(`${where}: ${m[0]} → ${x.exists?"dada pendent":"no existeix al panell"}`); }
      const clean = s.replace(TOK,"").replace(/\*\*/g,"");
      const nums = clean.match(/\d+(?:[.,]\d+)*/g);
      if(nums && !toks.length) noSrc.push(`${where}: «${clean.trim().slice(0,140)}${clean.length>140?"…":""}» (xifres: ${nums.join(", ")})`);
    }
  }
  if(noSrc.length) E.push({t:`${noSrc.length} frases amb xifres sense font citada.`, list:noSrc});
  if(badTok.length) E.push({t:`${badTok.length} referències del text apunten a dades pendents o inexistents.`, list:badTok});
  // 4. Dates fora de la setmana
  const out=[];
  for(const x of allRows()){ if(!okRow(x)||!x.dataDate) continue;
    if(x.ref==="fmi") continue;
    if(IND[x.ind].mode==="none"){ if(!x.consultDate) out.push(`${lbl(x.ind)} · ${REFS[x.ref]} sense data de consulta`); continue; }
    if(x.ref==="last" && (x.dataDate<r.weekStart||x.dataDate>r.weekEnd)) out.push(`${IND[x.ind].l} · Darrera dada amb data ${fmtD(x.dataDate)} (fora del ${fmtD(r.weekStart)}–${fmtD(r.weekEnd)})`);
    if(x.ref==="w1" && (x.dataDate<addD(r.weekStart,-7)||x.dataDate>addD(r.weekEnd,-7))) out.push(`${IND[x.ind].l} · Setmana anterior amb data ${fmtD(x.dataDate)}`);
    if(!["last","w1"].includes(x.ref)){ const tg=refTarget(r,x.ref); const diff=Math.abs((pd(x.dataDate)-pd(tg))/864e5); if(diff>4) W.push({t:`${IND[x.ind].l} · ${REFS[x.ref]}: data ${fmtD(x.dataDate)} lluny de la data de referència ${fmtD(tg)}`}); }
    if(!x.consultDate) out.push(`${IND[x.ind].l} · ${REFS[x.ref]} sense data de consulta`);
  }
  const cited = new Set(); texts.forEach(({t})=>{ for(const m of t.matchAll(TOK)) if(m[1]==="f") cited.add(m[2]); });
  for(const id of cited){ const f=S.facts[id]; if(okFact(f) && f.date && (f.date<addD(r.weekStart,-2)||f.date>r.weekEnd)) out.push(`Fet «${f.text.slice(0,70)}…» datat el ${fmtD(f.date)}`); }
  const agFrom = r.type==="mensual" ? r.pubDate : addD(r.weekStart,7);
  const agTo = r.type==="mensual" ? (()=>{const p=pd(r.pubDate); return eom(p.getUTCFullYear(),p.getUTCMonth());})() : addD(r.weekEnd,7);
  for(const id of (r.agenda||[])){ const f=S.facts[id]; if(f && f.date && (f.date<agFrom||f.date>agTo)) out.push(`Agenda «${f.text}» datada el ${fmtD(f.date)} (fora del període ${fmtD(agFrom)}–${fmtD(agTo)})`); }
  if(out.length) E.push({t:`${out.length} dates fora del període de l'informe.`, list:out});
  // 5. Elements obligatoris
  if(!r.headline) E.push({t:"Falta triar el titular."});
  if(!r.summary) E.push({t:"Falta el resum per a la fitxa."});
  if(r.type==="macro" && !(r.bullets||[]).length) E.push({t:"El cos de l'informe és buit."});
  if(r.type==="ww" && !r.comentari) E.push({t:"Falta el comentari de mercat."});
  if(r.type==="ww" && !r.funds) W.push({t:"No s'han carregat les rendibilitats dels fons (CSV de CI Gestió)."});
  if(r.type==="mensual"){
    const emp = MONTH_SECTIONS.filter(m=>!m.house && !(secOf(r,m.id).text||"").trim());
    if(emp.length) E.push({t:`${emp.length} apartats sense redactar.`, list:emp.map(m=>`${m.n} ${m.t}`)});
    const hv = MONTH_SECTIONS.filter(m=>m.house && !(secOf(r,m.id).approved && (secOf(r,m.id).text||"").trim()));
    if(hv.length) E.push({t:`${hv.length} blocs de «visió de la casa» pendents de redacció o aprovació per Research.`, list:hv.map(m=>m.t)});
    if(!r.sectors) W.push({t:"No s'ha carregat la Taula 5 (evolució sectorial, export de Bloomberg)."});
    if(!(r.agenda||[]).length) W.push({t:"La Taula 2 (pròxims esdeveniments) és buida."});
  }
  if(r.type==="macro" && !(r.agenda||[]).length) W.push({t:"L'agenda de la setmana vinent és buida."});
  if(r.type==="macro" && !r.chart) W.push({t:"No hi ha gràfic de la setmana."});
  if(r.type==="macro"){ const w = (r.bullets||[]).join(" ").replace(TOK,"").split(/\s+/).filter(Boolean).length; if(w && (w<420||w>800)) W.push({t:`Longitud del cos: ${w} paraules (els informes reals en tenen unes 550-700).`}); }
  return {E,W};
}

/* ======================= Render principal ======================= */
function render(){
  $("#nav-portada").classList.toggle("on",S.view==="portada");
  $("#nav-editor").classList.toggle("on",S.view==="editor");
  const app=$("#app");
  let pre="";
  if(S.dbState==="none") pre=`<div class="banner err">La base de dades de l'artefacte no està disponible en aquesta vista (cal haver iniciat sessió a claude.ai). Els informes no es poden carregar ni desar.</div>`;
  if(S.dbState==="slow") pre=`<div class="banner warn">Encara no s'ha pogut connectar amb la base de dades. Les dades poden no estar actualitzades.</div>`;
  if(S.dbState==="err") pre=`<div class="banner err">Error de la base de dades: ${esc(S.dbErr||"")}</div>`;
  if(!S.canWrite) pre+=`<div class="banner info">Tens accés de lectura: pots consultar i descarregar, però no modificar.</div>`;
  app.innerHTML = pre + (S.view==="portada" ? viewPortada() : viewEditor());
  if(S.view==="editor" && S.tab==="previa") mountChart();
}

      <div><div class="small muted">${isM?`Títol oficial (cobreix ${prevM}; publicació ${fmtD(mon)})`:`Títol oficial (de dilluns ${fmtD(mon)} a divendres ${fmtD(addD(mon,4))}; publicació ${fmtD(addD(mon,7))})`}</div><div class="title-out">${esc(proposed)}</div></div>

function statusBar(r,qc){
  const w=S.canWrite?"":"disabled";
  const b=[];
  if(r.status==="esborrany") b.push(`<button class="btn" ${w} onclick="setStatus('revisio')">Envia a revisió</button>`);
  if(r.status==="esborrany"||r.status==="revisio") b.push(`<button class="btn pri" ${w} ${qc.E.length?"disabled":""} onclick="setStatus('llest')" title="${qc.E.length?"Hi ha "+qc.E.length+" incidències bloquejants al control de qualitat":""}">Marca com a Llest</button>${qc.E.length?`<span class="small pend">Bloquejat: ${qc.E.length} incidències al control de qualitat</span>`:""}`);
  if(r.status==="llest") b.push(`<button class="btn pri" ${w} onclick="setStatus('publicat')">Publica a la portada</button><button class="btn" ${w} onclick="setStatus('revisio')">Torna a revisió</button>`);
  if(r.status==="publicat") b.push(`<button class="btn" ${w} onclick="setStatus('revisio')">Retira i torna a revisió</button>`);
  return `<div class="statusbar">${b.join("")}<span class="grow"></span><details><summary class="small muted">Historial</summary><div class="log">${(r.log||[]).map(l=>`<div>${esc(new Date(l.at).toLocaleString("ca-ES"))} — ${esc(l.text)}</div>`).join("")}</div></details></div>`;
}
async function setStatus(s){
  if((s==="llest"||s==="publicat") && runQC().E.length){ toast("No es pot marcar com a Llest: hi ha incidències pendents."); return; }
  await saveReport({status:s}, `Estat canviat a «${rsLabel(s)}».`); render();
}

/* ----- Pestanya Dades ----- */
function tabDades(){
  const r=S.cur, rows=allRows(); const refs=[...new Set(pairs(r.type).map(p=>p.ref))];
  const cnt = {tots:rows.length, pendent:rows.filter(x=>!okRow(x)).length, verificat:rows.filter(x=>x.status==="verificat"&&okRow(x)).length, manual:rows.filter(x=>x.status==="manual"&&okRow(x)).length};
  const f=S.filter;
  let h = `<div class="card sec">
    <div class="row"><h3 class="grow">Panell de recopilació de dades</h3>
      <button class="btn pri" ${S.canWrite?"":"disabled"} onclick="collectModal()">Recopila / actualitza les dades</button>
      <label class="btn" style="${S.canWrite?"":"opacity:.45;pointer-events:none"}">Importa CSV<input type="file" accept=".csv,.txt" style="display:none" onchange="importCSV(this.files[0]);this.value=''"></label>
      <button class="btn" onclick="csvTemplate()">Plantilla CSV</button></div>

    <div class="filters">${["tots","pendent","verificat","manual"].map(k=>`<button class="${f===k?"on":""}" onclick="S.filter='${k}';render()">${{tots:"Totes",pendent:"Pendents",verificat:"Verificades",manual:"Revisades manualment"}[k]} (${cnt[k]})</button>`).join("")}</div>
    <div style="overflow:auto"><table class="dt"><thead><tr><th>Indicador</th><th>Referència</th><th style="text-align:right">Valor</th><th style="text-align:right">Variació</th><th>Font</th><th>Data dada</th><th>Data consulta</th><th>Estat</th><th></th></tr></thead><tbody>`;
  for(const t of TYPES[r.type].tables){
    h += `<tr class="grp"><td colspan="9">${esc(t.title)}</td></tr>`;
    for(const ind of t.blocks.flat()) for(const ref of (t.refs||TYPES[r.type].refs)){
      const x=getRow(ind,ref);
      const show = f==="tots" || (f==="pendent"&&!okRow(x)) || (f==="verificat"&&x.status==="verificat"&&okRow(x)) || (f==="manual"&&x.status==="manual"&&okRow(x));
      if(!show) continue;
      const ch = ref==="last" ? change(ind,x,getRow(ind,r.type==="mensual"?"m1":"w1")) : (ref!=="last" ? change(ind,getRow(ind,"last"),x) : null);
      const val = okRow(x) ? esc(nf(x.value, IND[ind].d, true)) + (x.unit&&x.unit!=="pts"?` <span class="muted small">${esc(x.unit)}</span>`:"") : (x.value!=null && x.value!=="" ? `<span class="pend">[PENDENT]</span><div class="small muted">${esc(nf(x.value,IND[ind].d,true))} sense verificar</div>` : `<span class="pend">[PENDENT]</span>`);
      h += `<tr class="${okRow(x)?"":"isp"}"><td>${ref==="last"?`<b>${esc(lbl(ind))}</b>`:`<span class="muted">${esc(lbl(ind))}</span>`}</td><td class="small">${REFS[ref]}</td>
        <td class="num val">${val}</td><td class="num">${ch?`<span style="color:${ch.v>0?"var(--green)":ch.v<0?"var(--red)":"inherit"}">${esc(ch.s)}</span>`:"—"}</td>
        <td class="src small">${x.org?esc(x.org):"—"}${x.url?`<br><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url.replace(/^https?:\/\//,"").slice(0,60))}${x.url.length>68?"…":""}</a>`:""}${x.note?`<div class="muted">${esc(x.note)}</div>`:""}</td>
        <td class="small">${fmtD(x.dataDate)}</td><td class="small">${fmtD(x.consultDate)}</td><td><span class="pill st-${okRow(x)?x.status:"pendent"}">${stLabel(okRow(x)?x.status:"pendent")}</span></td>
        <td><button class="btn sm" ${S.canWrite?"":"disabled"} onclick="editRow('${ind}','${ref}')">Edita / valida</button></td></tr>`;

  }
  h += `</tbody></table></div></div>`;

function parseCSV(t){
  const sep = (t.split("\n")[0].match(/;/g)||[]).length >= (t.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
  return t.replace(/\r/g,"").split("\n").filter(l=>l.trim()).map(l=>{ const out=[]; let cur="",q=false;
    for(const c of l){ if(c==='"'){ q=!q; continue; } if(c===sep&&!q){ out.push(cur); cur=""; } else cur+=c; } out.push(cur); return out.map(s=>s.trim()); });
}
const num = s => { if(s===undefined||s==="") return null; let x=s.replace(/%/g,"").trim(); if(/,\d+$/.test(x)) x=x.replace(/\./g,"").replace(",","."); const n=Number(x); return isNaN(n)?null:n; };
async function importCSV(file){
  if(!file) return; const rows=parseCSV(await file.text()); if(rows.length<2){ toast("Fitxer buit."); return; }
  const hd=rows[0].map(h=>h.toLowerCase());
  if(hd[0]==="index" && hd[1]==="sector"){ // Taula 5 mensual
    const items=rows.slice(1).map(c=>({index:c[0],sector:c[1],value:num(c[2])})).filter(x=>x.index&&x.value!==null);
    await saveReport({sectors:{items, org:"Bloomberg (export)", url:"", dataDate:S.cur.weekEnd, consultDate:today(), file:file.name}}, `Importada la Taula 5 (${items.length} línies) des de ${file.name}.`);
    toast(`Importats ${items.length} sectors.`); render(); return;
  }
  if(hd[0]==="fons"){ // fons CI Gestió
    const items=rows.slice(1).map(c=>({fons:c[0],cat:c[1],mes:num(c[2]),any:num(c[3]),m12:num(c[4]),a3:num(c[5]),a5:num(c[6]),vol:num(c[7]),risc:c[8]}));
    await saveReport({funds:{items, org:"CI Gestió / CI Vida (dades internes)", url:"", dataDate:S.cur.weekEnd, consultDate:today(), file:file.name}}, `Importades ${items.length} línies de fons des de ${file.name}.`);
    toast(`Importats ${items.length} fons.`); render(); return;
  }
  const ix=k=>hd.indexOf(k); let ok=0, bad=0;
  for(const c of rows.slice(1)){
    const ind=c[ix("indicador")], ref=c[ix("referencia")], v=num(c[ix("valor")]);
    if(!IND[ind]||!REFS[ref]||v===null){ bad++; continue; }
    const org=c[ix("font")]||"", dd=c[ix("data_dada")]||"";
    const d={ind,ref,value:v,unit:c[ix("unitat")]||"",org,url:c[ix("url")]||"",dataDate:dd,consultDate:today(),note:(c[ix("nota")]||"")+` (importat de ${file.name})`,status:(org&&dd)?"manual":"pendent",editedAt:new Date().toISOString()};
    const cur=S.rows[rowKey(ind,ref)]; if(cur && cur.status==="manual" && cur.org!==org){ /* conserva revisions manuals */ }
    try{ await S.db.doc(`reports/${S.cur.id}/rows/${rowKey(ind,ref)}`).set(d); ok++; }catch(e){ bad++; }
  }
  await saveReport({}, `Importades ${ok} dades des de ${file.name}${bad?` (${bad} línies ignorades)`:""}.`);
  toast(`Importades ${ok} dades${bad?`; ${bad} línies ignorades`:""}.`);
}

function contextData(){
  const r=S.cur, L=[];
  for(const {ind,ref} of pairs(r.type)){ const x=S.rows[rowKey(ind,ref)]; if(okRow(x)) L.push(`{{r:${ind}:${ref}}} ${lbl(ind)} · ${REFS[ref]} = ${nf(x.value,IND[ind].d,true)}${x.unit&&x.unit!=="pts"?" "+x.unit:""} (data ${fmtD(x.dataDate)}; font ${x.org})`); }
  const F=Object.values(S.facts).filter(f=>okFact(f)&&f.kind!=="agenda").map(f=>`{{f:${f.id}}} ${f.text} (data ${fmtD(f.date)}; font ${f.org})`);
  return {L,F};

const STYLE = `Ets el departament de Research de Caixa Enginyers. Escrius en català, amb to analític i professional adreçat a inversors, amb terminologia financera precisa (rendibilitats, diferencials de crèdit, prima de risc) i sense ser divulgatiu. Sense firmes personals.
Regles innegociables:
- Fes servir NOMÉS les dades i els fets de les llistes. No inventis, no estimis ni completis cap xifra ni cap fet de memòria. Si un tema no té dades a les llistes, no el tractis.
- Cada frase que contingui una xifra ha d'incloure, just després de la dada, el token exacte de la llista (per exemple {{r:us10:last}} o {{f:cpi}}). No modifiquis els tokens.
- Xifres amb coma decimal i espai abans de % ("6,5 %"). Comparacions amb el període anterior entre parèntesis amb el format "(set26: 36,3 %)". Trimestres com "3T26".`;
async function callClaude(prompt){
  try{ return await S.sample.json(prompt, {modelTier:"complex"}); }
  catch(e){ if(e && e.code==="rate_limited") throw new Error("Massa peticions: espera uns segons."); if(e && e.code==="not_granted") throw new Error("No has autoritzat l'ús de Claude des d'aquesta pàgina."); throw e; }
}

FORMAT DE L'INFORME SETMANAL MACRO: 4 o 5 vinyetes, unes 550-700 paraules en total. Cada vinyeta comença amb una frase curta en negreta entre ** ** que en resumeix el missatge clau, seguida de 3-6 frases. Ordre habitual: 1) visió general dels mercats de la setmana; 2) Estats Units, inflació i Fed; 3) geopolítica i energia; 4) altres dades macro (Xina, zona euro, Japó…); 5) Espanya (economia i política). Sense conclusió.

    return "";
  };
  // Agrupa els apartats en tres pàgines (1, 2 i 3)
  const groups=[[],[],[]]; let g=-1;
  for(const m of MONTH_SECTIONS){ if(m.h1) g++; groups[g].push(m); }
  const sec = m => { const sc=secOf(r,m.id); const txt=(sc.text||"").trim();
    let body;
    if(m.house) body = txt && sc.approved ? `<p style="text-align:justify">${renderText(txt,src).replace(/\n+/g,"</p><p style='text-align:justify'>")}</p>` : `<p><span class="bad">[PENDENT] Visió de la casa: ${esc(m.t.replace("Visió de la casa: ",""))} — a redactar o aprovar per Research</span></p>`;
    else body = txt ? `<p style="text-align:justify">${renderText(txt,src).replace(/\n+/g,"</p><p style='text-align:justify'>")}</p>` : `<p><span class="bad">[PENDENT] Apartat sense redactar</span></p>`;
    return `${m.h1?`<h2 class="ps" style="margin-top:14px">${esc(m.h1)}</h2>`:""}${m.h2?`<h3 class="ps">${esc(m.h2)}</h3>`:""}${m.house?"":`<h3 class="ps" style="font-size:14px">${esc(m.n)} ${esc(m.t)}</h3>`}${body}${m.after?block(m.after):""}`; };
  const head = `<div class="phead" style="height:150px;padding-top:40px">
      <svg width="794" height="150" viewBox="0 0 794 150" preserveAspectRatio="none"><g fill="none" stroke="rgba(255,255,255,.07)" stroke-width="28"><circle cx="120" cy="30" r="110"/><circle cx="430" cy="170" r="140"/></g></svg>
      <h1 style="position:relative;font-size:25px;max-width:460px">Informe mensual de macroeconomia i mercats financers</h1>
      <div class="logo" style="top:46px"><img src="${LOGO}" alt="Caixa Enginyers"></div><div class="tag" style="top:96px">Humanitzem les teves finances</div></div>`;
  let n=0;
  const pages = groups.map((gr,i)=>`<div class="page">${wm(r)}${i===0?head:""}<div class="pbody" style="padding-top:${i===0?22:56}px">${gr.map(sec).join("")}</div>${footer(r,++n,i===0)}</div>`).join("");
  const fonts = `<div class="page">${wm(r)}<div class="pbody" style="padding-top:56px"><h2 class="ps">Fonts</h2>
    <ol class="fonts" style="padding-left:22px">${src.list.map(s=>`<li value="${s.n}"><b>${esc(s.org)}</b>${s.details.length?`. ${esc(s.details.slice(0,6).join("; "))}${s.details.length>6?"; …":""}`:""}. ${s.url?`<a href="${esc(s.url)}">${esc(s.url)}</a>. `:""}Data del dada: ${[...s.dates].sort().map(fmtD).join(", ")||"—"}. Consulta: ${[...s.consults].sort().map(fmtD).join(", ")||"—"}.</li>`).join("")}</ol></div>${footer(r,++n,false)}</div>`;
  const legal = `<div class="page">${wm(r)}<div class="pbody legal" style="padding-top:56px"><h3 class="ps" style="margin-top:0">INFORMACIÓ LEGAL</h3>
    ${LEGAL_MENSUAL.map(p=>p.startsWith("#")?`<h4>${esc(p.slice(1))}</h4>`:`<p>${esc(p)}</p>`).join("")}</div>${footer(r,++n,false)}</div>`;
  return pages+fonts+legal;
}
function sectorTable(r){
  const sx=r.sectors; const ttl=`<h3 class="ps">Taula 5. Evolució sectorial dels principals índexs de renda variable des del darrer informe</h3>`;
  if(!sx) return ttl+`<p><span class="bad">[PENDENT]</span> Cal importar l'export de Bloomberg (index;sector;valor).</p>`;
  const idx=[...new Set(sx.items.map(x=>x.index))];
  const cols=idx.map(i=>sx.items.filter(x=>x.index===i).sort((a,b)=>b.value-a.value));
  const rows=Math.max(...cols.map(c=>c.length));
  let h=`<table class="mt"><thead><tr>${idx.map(i=>`<th class="l" colspan="2">${esc(i)}</th>`).join("")}</tr></thead><tbody>`;
  for(let k=0;k<rows;k++) h+=`<tr>${cols.map(c=>c[k]?`<td class="l">${esc(c[k].sector)}</td><td class="${c[k].value>0?"pos":c[k].value<0?"neg":""}">${nf(c[k].value,1)}%</td>`:"<td></td><td></td>").join("")}</tr>`;
  return ttl+h+`</tbody></table><div style="font-size:9px">Font: ${esc(sx.org)}.</div>`;
}
function wwPages(r,src){
  const pctCell=(ind,a,b)=>{ const c=change(ind,getRow(ind,a),getRow(ind,b)); return c?nf(c.v,ind.startsWith("eur")?2:1)+"%":`<span class="bad">[PENDENT]</span>`; };
  const tbl=TYPES.ww.tables.map(t=>{
    const hd = t.kind==="level" ? `<tr><th class="l">${t.title}</th><th>ACTUAL</th><th>SETMANAL</th><th>31.12</th></tr>` : `<tr><th class="l">${t.title}</th><th>ACTUAL</th><th>SETMANAL</th><th>${pd(r.weekEnd).getUTCFullYear()}</th></tr>`;
    const body=t.blocks.map(bl=>bl.map(ind=>`<tr><td class="l">${esc(IND[ind].ww||IND[ind].l)}${src.rowNums(ind).length?`<sup>[${src.rowNums(ind).join(",")}]</sup>`:""}</td><td>${cell(ind,"last")}</td>${t.kind==="level"?`<td>${cell(ind,"w1")}</td><td>${cell(ind,"ytd")}</td>`:`<td>${pctCell(ind,"last","w1")}</td><td>${pctCell(ind,"last","ytd")}</td>`}</tr>`).join("")).join("");
    return hd+body; }).join("");
  const f=r.funds;
  const fundT = (cat,ttl)=>{ const it=(f?.items||[]).filter(x=>(x.cat||"").toUpperCase()===cat); if(!it.length) return ""; return `<table class="wwtab" style="width:714px;margin:10px auto"><tr><th class="l">${ttl}</th><th>MES</th><th>${pd(r.weekEnd).getUTCFullYear()}</th><th>12 MESOS</th><th>3 ANYS an.</th><th>5 ANYS an.</th><th>VOLATILITAT</th><th>RISC</th></tr>${it.map(x=>`<tr><td class="l">${esc(x.fons)}</td>${[x.mes,x.any,x.m12,x.a3,x.a5,x.vol].map(v=>`<td>${v==null?"—":nf(v,2)+"%"}</td>`).join("")}<td>${esc(x.risc||"")}</td></tr>`).join("")}</table>`; };
  const p1=`<div class="page">${wm(r)}<div class="wwhead"><img src="${LOGO}" alt=""><div class="ttl">Informe Setmanal</div><div class="urls">www.enginyersfons.com<br>www.caixaenginyers.com</div></div>
    <div class="wwdate">${fmtD(r.pubDate)}</div><div class="wwsec">Comentari de mercat</div><div class="wwtxt">${renderText(r.comentari||"[PENDENT] Comentari de mercat",src).replace(/\n/g,"<br>")}</div>
    <div class="wwsec">Evolució variables</div><table class="wwtab">${tbl}</table>
    <div class="wwsec">Destacats: ${esc(r.destacatsTitol||"")}</div><div class="wwtxt">${esc(r.destacats||"").replace(/\n/g,"<br>")||"<span class='muted'>Sense text destacat.</span>"}</div></div>`;
  const p2=`<div class="page">${wm(r)}<div class="wwsec" style="margin-top:30px">Rendiment fons propis</div>${f?fundT("FI","FONS D'INVERSIONS (Classes A)")+fundT("PP","FONS DE PENSIONS (Classes A)")+fundT("CM","CARTERES MODEL"):`<div class="wwtxt"><span class="bad">[PENDENT]</span> Rendiments dels fons (CSV de CI Gestió)</div>`}
    <div class="wwsec">Fonts</div><ol class="fonts" style="padding:0 40px 0 60px;font-size:10px">${src.list.map(s=>`<li value="${s.n}"><b>${esc(s.org)}</b>. ${s.url?esc(s.url)+". ":""}Data: ${[...s.dates].sort().map(fmtD).join(", ")}. Consulta: ${[...s.consults].map(fmtD).join(", ")}.</li>`).join("")}</ol>
    <div class="wwsec">Disclaimer</div><div class="wwtxt legal" style="font-size:9px">${LEGAL_WW.map(p=>`<p style="font-size:9px">${esc(p)}</p>`).join("")}</div></div>`;
  return p1+p2;
}
function chartSVG(c){
  const W=330,H=200,pl=34,pr=8,pt=8,pb=40; const all=c.series.flatMap(s=>s.values).filter(v=>v!=null);
  if(!all.length) return "";
  let mn=Math.min(...all), mx=Math.max(...all); const pad=(mx-mn)*0.15||0.1; mn-=pad; mx+=pad;
  const x=i=>pl+(c.labels.length<2?0:i*(W-pl-pr)/(c.labels.length-1)), y=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn);
  const cols=["#1b4fb0","#f2a900","#7a8699","#2e7d32"];
  const ticks=5, tv=[...Array(ticks)].map((_,i)=>mn+(mx-mn)*i/(ticks-1));
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="font-family:Lato;font-size:9px">`;
  tv.forEach(v=>{ s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e6ec"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end" fill="#5b6475">${nf(v,2)}</text>`; });
  c.labels.forEach((l,i)=>{ s+=`<text x="${x(i)}" y="${H-pb+13}" text-anchor="middle" fill="#5b6475">${esc(l)}</text>`; });
  c.series.forEach((se,k)=>{ const pts=se.values.map((v,i)=>v==null?null:`${x(i)},${y(v)}`).filter(Boolean).join(" ");
    s+=`<polyline fill="none" stroke="${cols[k%4]}" stroke-width="2" points="${pts}"/>`;
    se.values.forEach((v,i)=>{ if(v!=null) s+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${cols[k%4]}"/>`; });
    s+=`<line x1="${pl+k*90}" x2="${pl+k*90+18}" y1="${H-10}" y2="${H-10}" stroke="${cols[k%4]}" stroke-width="2"/><text x="${pl+k*90+22}" y="${H-7}" fill="#1d2433">${esc(se.name)}</text>`; });
  return s+`</svg>`;
}
function mountChart(root=document){ const box=root.querySelector("#chartbox"); if(box && S.cur && S.cur.chart) box.innerHTML=chartSVG(S.cur.chart); }

/* ----- Exportació PDF ----- */
let h2pLoading=null;
function loadH2P(){ if(window.html2pdf) return Promise.resolve(); if(h2pLoading) return h2pLoading;
  h2pLoading=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"; s.onload=res; s.onerror=()=>rej(new Error("No s'ha pogut carregar el generador de PDF")); document.head.appendChild(s); }); return h2pLoading; }
async function exportPDF(id){
  if(!S.downloads){ toast("Les descàrregues no estan disponibles en aquesta vista."); return; }
  if(id && (!S.cur || S.cur.id!==id)){ openReport(id,false); await new Promise(r=>setTimeout(r,1500)); }
  const r=S.cur; if(!r) return;
  toast("Generant el PDF…",8000);
  try{
    await loadH2P();
    const host=document.createElement("div"); host.style.cssText="position:fixed;left:-10000px;top:0;width:794px";
    host.innerHTML=pagesHTML(r); document.body.appendChild(host); mountChart(host);
    host.querySelectorAll(".page").forEach((p,i)=>{ p.style.boxShadow="none"; p.style.height="1123px"; p.style.minHeight="1123px"; if(i) p.style.pageBreakBefore="always"; });
    const blob = await html2pdf().set({margin:0, image:{type:"jpeg",quality:0.95}, html2canvas:{scale:2, useCORS:true, backgroundColor:"#ffffff"},
      jsPDF:{unit:"px", format:[794,1123], orientation:"portrait", hotfixes:["px_scaling"]}, pagebreak:{mode:["css"]}}).from(host).outputPdf("blob");
    host.remove();
    const d=pd(r.pubDate); const fn=`${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,"0")}${String(d.getUTCDate()).padStart(2,"0")} CA ${r.type==="ww"?"Weekly Watch Carteras":"Informe setmanal"}.pdf`;
    await S.downloads.save({filename:fn, data:blob}); toast("PDF desat.");
  }catch(e){ toast(e && e.code==="declined" ? "Descàrrega cancel·lada." : "No s'ha pogut generar el PDF: "+(e.message||e.code||e)); }
}

init();
